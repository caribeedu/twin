name: Feature request
description: Suggest an improvement or new capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Twin prioritizes cognitive continuity and evidence over feature count.
        Skim [IDENTITY.md](https://github.com/caribeedu/twin/blob/main/docs/IDENTITY.md)
        and [ROADMAP.md](https://github.com/caribeedu/twin/blob/main/docs/ROADMAP.md)
        before proposing large scope changes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction or gap are you hitting?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Twin do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, scenarios, or constraints that matter.
