[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-cognition"
version = "2.4.0"
description = " A governed cognitive layer that transforms distributed observations into reusable understanding across models and interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edu Caribé" }]
keywords = [
    "cognitive-os",
    "memory",
    "judgment",
    "mcp",
    "context",
    "personal-ai",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "textual>=0.80",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.0,<2"]
postgres = ["psycopg[binary]>=3.1"]
crypto = ["cryptography>=42.0"]
dev = [
    "pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.27", "mcp>=1.0,<2",
    "psycopg[binary]>=3.1", "cryptography>=42.0", "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/caribeedu/twin"
Repository = "https://github.com/caribeedu/twin"
Issues = "https://github.com/caribeedu/twin/issues"
Documentation = "https://github.com/caribeedu/twin/blob/main/docs/SETUP.md"
Changelog = "https://github.com/caribeedu/twin/blob/main/docs/CHANGELOG.md"

[project.scripts]
twin = "twin.interfaces.cli:main"
twin-runtime = "twin.runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["twin*"]

[tool.setuptools.package-data]
twin = ["defaults/*.yaml", "interfaces/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
