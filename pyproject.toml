[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin"
version = "1.0.0"
description = "Personal Cognitive Operating System — local-first memory, judgment and context layer exposed over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
crypto = ["cryptography>=42.0"]
dev = [
    "pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.27", "mcp>=1.0",
    "psycopg[binary]>=3.1", "cryptography>=42.0",
]

[project.scripts]
twin = "twin.interfaces.cli:main"
twin-runtime = "twin.runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["twin*"]

[tool.setuptools.package-data]
twin = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
