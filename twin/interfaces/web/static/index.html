<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twin — Command Center</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/favicon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="center-body">
  <div class="mesh" aria-hidden="true"></div>

  <div class="center-shell center-shell--flat">
    <header class="center-brandbar">
      <a class="brand" href="#home">
        <img class="mark" src="/static/logo.svg" width="32" height="32" alt="" />
        <span class="brand-text">
          <strong>Twin</strong>
          <em>Command Center</em>
        </span>
      </a>
      <label class="vault-picker" title="Active vault">
        <span class="vault-picker-label">Vault</span>
        <select id="vault-select" aria-label="Active vault"></select>
      </label>
    </header>

    <nav class="center-tabs" aria-label="Main">
      <a class="center-tab" href="#home" data-nav="home">Home</a>
      <a class="center-tab" href="#explore" data-nav="explore">Explore</a>
      <a class="center-tab" href="#review" data-nav="review">Review</a>
      <a class="center-tab" href="#cognize" data-nav="cognize">Cognize</a>
      <a class="center-tab" href="#connectors" data-nav="connectors">Connectors</a>
      <a class="center-tab" href="#inject" data-nav="inject">Inject</a>
      <a class="center-tab" href="#ops" data-nav="ops">Ops</a>
      <a class="center-tab" href="#sessions" data-nav="sessions">Sessions</a>
    </nav>

    <div class="center-main">
      <header class="center-top" id="center-top">
        <p class="pane-eyebrow" id="pane-eyebrow">Home</p>
        <h1 class="pane-title" id="pane-title">General</h1>
      </header>
      <main id="app" class="app center-app"></main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
