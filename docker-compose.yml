# Local infrastructure for twin: PostgreSQL + pgvector (primary store) and
# Ollama (local models for extraction and embeddings).
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3:8b
#   docker compose exec ollama ollama pull nomic-embed-text
#   export TWIN_DB_URL=postgresql://twin:twin@localhost:5432/twin
#   twin init

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin
    ports:
      - "5432:5432"
    volumes:
      - twin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - twin-ollama:/root/.ollama
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  twin-pgdata:
  twin-ollama:
